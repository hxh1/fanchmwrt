name: Build FanchmWrt x86_64

on:
  workflow_dispatch:
  schedule:
    - cron: "20 18 * * 5"

permissions:
  contents: read

concurrency:
  group: fanchmwrt-x86-64
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext \
            git libelf-dev libncurses5-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl jq ca-certificates

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          test -d feeds/luci/applications/luci-app-adguardhome
          test -d feeds/packages/net/adguardhome

      - name: Add OpenClash, Mihomo and latest Zashboard
        shell: bash
        run: |
          set -euo pipefail
          work_dir=$(mktemp -d)
          trap 'rm -rf "$work_dir"' EXIT

          git clone --depth 1 --filter=blob:none --sparse --branch master \
            https://github.com/vernesong/OpenClash.git "$work_dir/OpenClash"
          git -C "$work_dir/OpenClash" sparse-checkout set luci-app-openclash
          rm -rf package/luci-app-openclash
          cp -a "$work_dir/OpenClash/luci-app-openclash" package/luci-app-openclash
          openclash_commit=$(git -C "$work_dir/OpenClash" rev-parse HEAD)

          zashboard_release=$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
            https://github.com/Zephyruso/zashboard/releases/latest)
          zashboard_tag=${zashboard_release##*/}
          [[ "$zashboard_tag" == v* ]]
          curl -fL --retry 3 \
            "https://github.com/Zephyruso/zashboard/releases/download/$zashboard_tag/dist-no-fonts.zip" \
            -o "$work_dir/zashboard.zip"
          mkdir -p "$work_dir/zashboard"
          unzip -q "$work_dir/zashboard.zip" -d "$work_dir/zashboard"
          zashboard_index=$(find "$work_dir/zashboard" -type f -name index.html -print | head -n 1)
          test -n "$zashboard_index"
          zashboard_root=${zashboard_index%/index.html}
          rm -rf package/luci-app-openclash/root/usr/share/openclash/ui/zashboard
          mkdir -p package/luci-app-openclash/root/usr/share/openclash/ui/zashboard
          cp -a "$zashboard_root/." \
            package/luci-app-openclash/root/usr/share/openclash/ui/zashboard/

          core_url=https://raw.githubusercontent.com/vernesong/OpenClash/core/master/meta/clash-linux-amd64.tar.gz
          curl -fL --retry 3 "$core_url" -o "$work_dir/clash-linux-amd64.tar.gz"
          mkdir -p "$work_dir/core" files/etc/openclash/core files/etc/uci-defaults
          tar -xzf "$work_dir/clash-linux-amd64.tar.gz" -C "$work_dir/core"
          install -m 0755 "$work_dir/core/clash" files/etc/openclash/core/clash_meta

          cat > files/etc/uci-defaults/99-openclash-x86-core <<'EOF'
          #!/bin/sh
          uci -q set openclash.config.core_type='Meta'
          uci -q set openclash.config.core_version='linux-amd64'
          uci -q commit openclash
          exit 0
          EOF
          chmod 0755 files/etc/uci-defaults/99-openclash-x86-core

          core_version=$(files/etc/openclash/core/clash_meta -v 2>/dev/null | head -n 1 || true)
          cat > files/etc/openclash/build-info <<EOF
          OpenClash commit: $openclash_commit
          Mihomo source: $core_url
          Mihomo version: $core_version
          Zashboard version: $zashboard_tag
          EOF

      - name: Configure x86_64 image
        shell: bash
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y
          CONFIG_GRUB_IMAGES=y
          CONFIG_GRUB_EFI_IMAGES=y
          CONFIG_TARGET_IMAGES_GZIP=y
          CONFIG_TARGET_ROOTFS_EXT4FS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_TARGET_KERNEL_PARTSIZE=64
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-theme-fanchmwrt=y
          CONFIG_PACKAGE_luci-app-fwx-app-center=y
          CONFIG_PACKAGE_luci-app-fwx-appfilter=y
          CONFIG_PACKAGE_luci-app-fwx-dashboard-setting=y
          CONFIG_PACKAGE_luci-app-fwx-dashboard=y
          CONFIG_PACKAGE_luci-app-fwx-feature=y
          CONFIG_PACKAGE_luci-app-fwx-mac-blacklist=y
          CONFIG_PACKAGE_luci-app-fwx-macfilter=y
          CONFIG_PACKAGE_luci-app-fwx-network=y
          CONFIG_PACKAGE_luci-app-fwx-record-whitelist=y
          CONFIG_PACKAGE_luci-app-fwx-record=y
          CONFIG_PACKAGE_luci-app-fwx-resources=y
          CONFIG_PACKAGE_luci-app-fwx-session-stat=y
          CONFIG_PACKAGE_luci-app-fwx-system=y
          CONFIG_PACKAGE_luci-app-fwx-traffic-stat=y
          CONFIG_PACKAGE_luci-app-fwx-user-record=y
          CONFIG_PACKAGE_luci-app-fwx-user=y
          CONFIG_PACKAGE_luci-app-fwx-wireless=y
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_dnsmasq-full=y
          CONFIG_PACKAGE_luci-app-openclash=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_adguardhome=y
          CONFIG_PACKAGE_luci-app-adguardhome=y
          EOF
          make defconfig
          grep -E 'CONFIG_PACKAGE_(luci-app-openclash|luci-app-adguardhome|adguardhome)=y' .config

      - name: Download sources
        run: make download -j8

      - name: Build firmware
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Collect output
        if: always()
        shell: bash
        run: |
          mkdir -p artifact
          cp .config artifact/build.config 2>/dev/null || true
          cp files/etc/openclash/build-info artifact/openclash-build-info 2>/dev/null || true
          find bin/targets/x86/64 -maxdepth 1 -type f \
            \( -name '*.img.gz' -o -name '*.manifest' -o -name 'sha256sums' \) \
            -exec cp -t artifact {} + 2>/dev/null || true

      - name: Upload firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fanchmwrt-x86-64-${{ github.run_number }}
          path: artifact/
          if-no-files-found: warn
          retention-days: 14
